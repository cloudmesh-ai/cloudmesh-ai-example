[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmesh-ai-{{name}}"
version = "0.1.0"
description = "{{name}} command for Cloudmesh AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cloudmesh-ai-common",
]

[project.entry-points."cloudmesh.ai.cmc"]
{{name}} = "cloudmesh.ai.command.{{name}}:register"